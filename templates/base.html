<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Field Notes · Jason Breedlove{% endblock %}</title><meta name="description" content="Notes on software, security, and building useful things by Jason Breedlove."><link rel="stylesheet" href="{{ url_for('static', filename='css/field-notes.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('get_all_posts') }}">JB / FIELD NOTES</a><nav aria-label="Main navigation"><a href="{{ url_for('get_all_posts') }}">Journal</a><a href="{{ url_for('about') }}">About</a><a href="{{ url_for('contact') }}">Contact</a>{% if current_user.is_authenticated %}<a href="{{ url_for('editor') }}">Editor</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Log out</button></form>{% else %}<a href="{{ url_for('login') }}">Log in</a><a href="{{ url_for('register') }}">Register</a>{% endif %}</nav></header><main>{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><footer><span>Jason Breedlove · Built with Flask & Python</span><a href="https://www.jasonbreedlove.dev/#projects">Back to portfolio ↗</a></footer></body></html>
